[project]
name = "btlite"
version = "0.1.0"
description = "BT-Lite - ein lokales, terminal-artiges Finanz-Analyse-Frontend"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

dependencies = [
    # --- Datenquellen (einzige Netzwerk-Schicht: src/btlite/data/) ---
    # yfinance 1.7 (Aug 2026): Statements sind TRANSPONIERT (Zeilen = Positionen),
    # auto_adjust=True ist Default -> keine "Adj Close"-Spalte mehr.
    "yfinance>=1.7,<2.0",
    "curl_cffi>=0.15",              # von yfinance fuer Browser-Impersonation genutzt
    "finvizfinance>=1.5,<2.0",
    # --- Rechnen ---
    # Obergrenzen sind hart: numba pinnt numpy<2.6. Ohne oberen Pin bricht ein
    # kuenftiges numpy-Release die Installation.
    "pandas>=2.2,<4.0",
    "numpy>=1.26,<2.6",
    # --- Portfolio ---
    # 1.6: risk_free_rate hat Default 0.0 (frueher 0.02) -> immer explizit setzen.
    "pyportfolioopt>=1.6,<2.0",
    # --- Visualisierung ---
    # Obergrenze ist hart: Plotly 7 hat scattermapbox entfernt, vectorbt 1.1
    # benutzt es aber weiterhin und deklariert nur plotly>=4.12 (fehlerhaft).
    # Mit Plotly 7 schlaegt "import vectorbt" fehl.
    "plotly>=6.0,<7.0",
    # --- UI-Shell ---
    # Dash 4: run_server() ist ENTFERNT -> app.run(). long_callback -> background.
    "dash>=4.4,<5.0",
    "dash-bootstrap-components>=2.0.4,<3.0",
    # --- Konfiguration & Vertraege ---
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # --- Caching ---
    "requests-cache>=1.2",
    "diskcache>=5.6",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
backtest = [
    # vectorbt 1.1 erzwingt pandas>=3.0.3, numpy>=2.4.6, numba>=0.66 und damit
    # Python>=3.12. Bewusst optional, damit das Kernprodukt frei von diesem
    # Versions-Kartell bleibt. backtest/vbt_engine.py importiert lazy.
    # Lizenz: Apache 2.0 WITH Commons Clause - kein kommerzieller Weiterverkauf.
    "vectorbt>=1.1,<2.0",
]
# Optionaler Zweit-Adapter, nur ueber backtest/bt_engine.py angesprochen.
backtrader = [
    "backtrader>=1.9.78",
]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
    "hypothesis>=6.100",
]

[project.scripts]
btlite = "btlite.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btlite"]

# ---------------------------------------------------------------- ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "PD",        # pandas-vet
    "NPY",       # numpy
    "RUF",       # ruff-specific
    "D",         # pydocstyle
    "ANN",       # annotations
    "PT",        # pytest-style
    "SIM",       # simplify
    "TID",       # tidy imports
    "PTH",       # use pathlib
]
ignore = [
    "D203",   # kollidiert mit D211
    "D213",   # kollidiert mit D212
    "ANN401", # Any in **kwargs ist an Provider-Grenzen unvermeidbar
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202"]
"src/btlite/models/__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------- mypy ----
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["btlite"]

[[tool.mypy.overrides]]
# Diese Pakete liefern keine py.typed-Marker.
module = [
    "yfinance.*",
    "finvizfinance.*",
    "vectorbt.*",
    "backtrader.*",
    "pypfopt.*",
    "plotly.*",
    "dash.*",
    "dash_bootstrap_components.*",
    "diskcache.*",
    "requests_cache.*",
]
ignore_missing_imports = true

# -------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: Test benoetigt Netzwerk - laeuft nicht in der Default-Suite",
]

[tool.coverage.run]
source = ["src/btlite"]
branch = true

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'if TYPE_CHECKING:',
    'raise NotImplementedError',
    '^\s*\.\.\.$',
]
